[project]
name = "pqr-analytics-engine"
version = "0.1.0"
description = "PQR Analytics Engine – Multi-stage data pipeline for PQR records analysis"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "polars==1.14.0",
    "duckdb==1.1.3",
    "pyarrow==18.1.0",
    "pandera==0.21.1",
    "multimethod==1.12",
    "scipy==1.14.1",
    "scikit-learn==1.6.0",
    "plotly==5.24.1",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.119.3",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pyright==1.1.411",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
