name: VantiOps 360 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      # ─── Python Backend ──────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Python Lint (ruff)
        run: python -m ruff check src tests
        working-directory: backend

      - name: Python Type Check (pyright)
        run: python -m pyright src
        working-directory: backend

      - name: Python Tests (pytest)
        id: pytest
        run: python -m pytest tests --junitxml=pytest-results.xml -q
        working-directory: backend

      # ─── Frontend ────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend

      - name: Generate audit report
        if: always()
        run: npm audit --omit=dev --json > npm-audit-production.json || true
        working-directory: frontend

      - name: Frontend Lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend Unit Tests
        id: vitest
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
        working-directory: frontend

      - name: Frontend Coverage
        run: npx vitest run --coverage --coverage.reporter=json-summary
        working-directory: frontend

      - name: Frontend Build
        run: npm run build
        working-directory: frontend

      # ─── SQL Migration Validation ───────────────────────────────────
      - name: Validate SQL Migrations
        run: |
          echo "Validating SQL migration files..."
          ERRORS=0
          for file in database/migrations/*.sql; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            if ! grep -qi "UP" "$file"; then
              echo "ERROR: $filename missing UP section"
              ERRORS=$((ERRORS + 1))
            fi
            if ! grep -qi "DOWN" "$file"; then
              echo "ERROR: $filename missing DOWN section"
              ERRORS=$((ERRORS + 1))
            fi
            if ! grep -qiE "(IF NOT EXISTS|IF EXISTS|ON CONFLICT)" "$file"; then
              echo "WARNING: $filename may not be idempotent"
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "SQL validation failed with $ERRORS error(s)"
            exit 1
          fi
          echo "All SQL migrations validated successfully"

      # ─── Security Scan ──────────────────────────────────────────────
      - name: Security Scan (exposed secrets)
        run: |
          echo "Scanning for exposed secrets..."
          FOUND=0
          PATTERNS=(
            'password\s*=\s*["\x27][^"\x27]+'
            'api[_-]?key\s*=\s*["\x27][^"\x27]+'
            'secret[_-]?key\s*=\s*["\x27][^"\x27]+'
            'access[_-]?token\s*=\s*["\x27][^"\x27]+'
            'private[_-]?key\s*=\s*["\x27][^"\x27]+'
            'DATABASE_URL\s*=\s*["\x27]postgres'
            'NEON_.*=\s*["\x27][^"\x27]+'
            'AWS_SECRET_ACCESS_KEY\s*=\s*["\x27][^"\x27]+'
          )
          EXCLUDE_DIRS="node_modules|.git|dist|.next|coverage|playwright-report|.hypothesis|__pycache__"
          EXCLUDE_FILES=".env.example|.env.local.example|requirements.md|design.md|tasks.md|CHANGELOG.md"
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.json" --include="*.sql" -E "$pattern" . \
              | grep -vE "($EXCLUDE_DIRS)" \
              | grep -vE "($EXCLUDE_FILES)" \
              | grep -vE "(process\.env|os\.environ|getenv|env\(|\.env)" \
              | grep -vE "(example|placeholder|YOUR_|changeme|xxx|dummy)" \
              | grep -vE '(export DATABASE_URL=.postgresql://\.\.\.)' \
              | grep -vE '(NEON_DATABASE_URL_ENV|NEON_DATABASE_URL.*=.*"NEON)' \
              || true)
            if [ -n "$MATCHES" ]; then
              echo "POTENTIAL SECRET EXPOSURE:"
              echo "$MATCHES"
              FOUND=$((FOUND + 1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo "Security scan found $FOUND potential secret exposure(s)"
            exit 1
          fi
          echo "Security scan passed"

      # ─── Playwright E2E ──────────────────────────────────────────────
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start application for E2E
        run: |
          npm run start > /tmp/vantiops.log 2>&1 &
          npx wait-on http://127.0.0.1:3000 --timeout 30000
        working-directory: frontend

      - name: Playwright E2E tests
        id: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-e2e-results.json
        run: npx playwright test --grep-invert "Visual Regression" --reporter=json
        working-directory: frontend

      - name: Visual Regression
        id: visual
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-visual-results.json
        run: |
          BASELINE_COUNT=$(find tests/e2e/visual-regression.spec.ts-snapshots/ -name "*.png" 2>/dev/null | wc -l)
          if [ "$BASELINE_COUNT" -lt 9 ]; then
            echo "::warning::Visual regression baselines not found ($BASELINE_COUNT/9)."
            echo "VISUAL_UNAVAILABLE=true" >> "$GITHUB_ENV"
            exit 1
          fi
          npx playwright test tests/e2e/visual-regression.spec.ts --reporter=json
        working-directory: frontend

      # ─── Evidence ───────────────────────────────────────────────────
      - name: Generate verified evidence
        if: always()
        working-directory: frontend
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          RUN_ID="${{ github.run_id }}"
          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          E2E_STATUS="${{ steps.e2e.outcome }}"
          VISUAL_STATUS="${{ steps.visual.outcome }}"
          if [ "${VISUAL_UNAVAILABLE}" = "true" ]; then VISUAL_STATUS="unavailable"; fi

          # Parse backend results from JUnit XML
          BE_PASSED=0; BE_SKIPPED=0; BE_FAILED=0; BE_TOTAL=0
          if [ -f "../backend/pytest-results.xml" ]; then
            BE_TOTAL=$(grep -oP 'tests="\K\d+' ../backend/pytest-results.xml | head -1 || echo 0)
            BE_FAILED=$(grep -oP 'failures="\K\d+' ../backend/pytest-results.xml | head -1 || echo 0)
            BE_SKIPPED=$(grep -oP 'skipped="\K\d+' ../backend/pytest-results.xml | head -1 || echo 0)
            BE_PASSED=$((BE_TOTAL - BE_FAILED - BE_SKIPPED))
          fi

          # Parse frontend results from Vitest JSON
          FE_PASSED=0; FE_FAILED=0; FE_TOTAL=0
          if [ -f "vitest-results.json" ]; then
            FE_PASSED=$(node -p "JSON.parse(require('fs').readFileSync('vitest-results.json','utf8')).numPassedTests" 2>/dev/null || echo 0)
            FE_FAILED=$(node -p "JSON.parse(require('fs').readFileSync('vitest-results.json','utf8')).numFailedTests" 2>/dev/null || echo 0)
            FE_TOTAL=$(node -p "JSON.parse(require('fs').readFileSync('vitest-results.json','utf8')).numTotalTests" 2>/dev/null || echo 0)
          fi

          # Parse coverage from coverage-summary.json
          STMT_PCT="null"; BRANCH_PCT="null"; FUNC_PCT="null"; LINE_PCT="null"
          if [ -f "coverage/coverage-summary.json" ]; then
            STMT_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.statements.pct")
            BRANCH_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.branches.pct")
            FUNC_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.functions.pct")
            LINE_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct")
          fi

          # Parse npm audit production
          AUDIT_CRITICAL=0; AUDIT_HIGH=0; AUDIT_MODERATE=0; AUDIT_LOW=0
          if [ -f "npm-audit-production.json" ]; then
            AUDIT_CRITICAL=$(node -p "try{JSON.parse(require('fs').readFileSync('npm-audit-production.json','utf8')).metadata.vulnerabilities.critical}catch(e){0}" 2>/dev/null || echo 0)
            AUDIT_HIGH=$(node -p "try{JSON.parse(require('fs').readFileSync('npm-audit-production.json','utf8')).metadata.vulnerabilities.high}catch(e){0}" 2>/dev/null || echo 0)
            AUDIT_MODERATE=$(node -p "try{JSON.parse(require('fs').readFileSync('npm-audit-production.json','utf8')).metadata.vulnerabilities.moderate}catch(e){0}" 2>/dev/null || echo 0)
            AUDIT_LOW=$(node -p "try{JSON.parse(require('fs').readFileSync('npm-audit-production.json','utf8')).metadata.vulnerabilities.low}catch(e){0}" 2>/dev/null || echo 0)
          fi

          # Parse E2E results from Playwright JSON
          E2E_PASSED=0; E2E_FAILED=0; E2E_SKIPPED=0; E2E_TOTAL=0
          if [ -f "playwright-e2e-results.json" ]; then
            E2E_PASSED=$(node -p "const r=JSON.parse(require('fs').readFileSync('playwright-e2e-results.json','utf8'));r.suites.reduce((a,s)=>a+s.specs.filter(t=>t.tests.some(tt=>tt.status==='expected')).length,0)" 2>/dev/null || echo 0)
            E2E_FAILED=$(node -p "const r=JSON.parse(require('fs').readFileSync('playwright-e2e-results.json','utf8'));r.suites.reduce((a,s)=>a+s.specs.filter(t=>t.tests.some(tt=>tt.status==='unexpected')).length,0)" 2>/dev/null || echo 0)
            E2E_SKIPPED=$(node -p "const r=JSON.parse(require('fs').readFileSync('playwright-e2e-results.json','utf8'));r.suites.reduce((a,s)=>a+s.specs.filter(t=>t.tests.some(tt=>tt.status==='skipped')).length,0)" 2>/dev/null || echo 0)
            E2E_TOTAL=$((E2E_PASSED + E2E_FAILED + E2E_SKIPPED))
          fi

          # Parse Visual Regression results from Playwright JSON
          VR_PASSED=0; VR_FAILED=0; VR_SKIPPED=0; VR_TOTAL=0
          if [ -f "playwright-visual-results.json" ]; then
            VR_PASSED=$(node -p "const r=JSON.parse(require('fs').readFileSync('playwright-visual-results.json','utf8'));r.suites.reduce((a,s)=>a+s.specs.filter(t=>t.tests.some(tt=>tt.status==='expected')).length,0)" 2>/dev/null || echo 0)
            VR_FAILED=$(node -p "const r=JSON.parse(require('fs').readFileSync('playwright-visual-results.json','utf8'));r.suites.reduce((a,s)=>a+s.specs.filter(t=>t.tests.some(tt=>tt.status==='unexpected')).length,0)" 2>/dev/null || echo 0)
            VR_SKIPPED=$(node -p "const r=JSON.parse(require('fs').readFileSync('playwright-visual-results.json','utf8'));r.suites.reduce((a,s)=>a+s.specs.filter(t=>t.tests.some(tt=>tt.status==='skipped')).length,0)" 2>/dev/null || echo 0)
            VR_TOTAL=$((VR_PASSED + VR_FAILED + VR_SKIPPED))
          fi

          # Visual regression baselines from filesystem
          VR_BASELINES=$(find tests/e2e/visual-regression.spec.ts-snapshots/ -name "*.png" 2>/dev/null | wc -l)

          # Determine verification status
          if [ "$E2E_STATUS" = "success" ] && [ "$VISUAL_STATUS" = "success" ] && [ "$FE_FAILED" = "0" ] && [ "$BE_FAILED" = "0" ]; then
            VERIFICATION_STATUS="success"
          elif [ "$VISUAL_STATUS" = "unavailable" ] && [ "$E2E_STATUS" = "success" ]; then
            VERIFICATION_STATUS="partial"
          else
            VERIFICATION_STATUS="failed"
          fi

          node -e "
          const evidence = {
            runId: ${RUN_ID},
            commitHash: '${COMMIT_SHA}',
            generatedAt: '${GENERATED_AT}',
            source: 'github-actions',
            workflowStatus: '${{ job.status }}',
            qualityJobStatus: '${{ job.status }}',
            backendTests: { passed: ${BE_PASSED}, skipped: ${BE_SKIPPED}, failed: ${BE_FAILED}, total: ${BE_TOTAL} },
            frontendTests: { passed: ${FE_PASSED}, failed: ${FE_FAILED}, total: ${FE_TOTAL} },
            e2e: { passed: ${E2E_PASSED}, skipped: ${E2E_SKIPPED}, failed: ${E2E_FAILED}, total: ${E2E_TOTAL}, status: '${E2E_STATUS}' },
            visualRegression: { passed: ${VR_PASSED}, failed: ${VR_FAILED}, skipped: ${VR_SKIPPED}, total: ${VR_TOTAL}, baselinesPresent: ${VR_BASELINES}, baselinesRequired: 9, status: '${VISUAL_STATUS}' },
            coverage: { statements: ${STMT_PCT}, branches: ${BRANCH_PCT}, functions: ${FUNC_PCT}, lines: ${LINE_PCT} },
            npmAuditProduction: { critical: ${AUDIT_CRITICAL}, high: ${AUDIT_HIGH}, moderate: ${AUDIT_MODERATE}, low: ${AUDIT_LOW} },
            productionSmoke: { status: 'pending' },
            verificationStatus: '${VERIFICATION_STATUS}'
          };
          require('fs').writeFileSync('public/evidence/latest-validation.json', JSON.stringify(evidence, null, 2));
          console.log('Evidence generated:', JSON.stringify({verification: evidence.verificationStatus, be: evidence.backendTests.passed, fe: evidence.frontendTests.passed, coverage: evidence.coverage.statements}));
          "

      - name: Evidence Integrity Gate
        if: success()
        working-directory: frontend
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          node -e "
          const e = JSON.parse(require('fs').readFileSync('public/evidence/latest-validation.json','utf8'));
          const errors = [];
          const expected = '${EXPECTED_SHA}';
          if (e.commitHash !== expected) errors.push('commitHash mismatch: got ' + e.commitHash + ' expected ' + expected);
          if (!e.backendTests || e.backendTests.total === 0) errors.push('backend total = 0');
          if (e.backendTests && e.backendTests.passed === 0) errors.push('backend passed = 0');
          if (e.backendTests && e.backendTests.failed !== 0) errors.push('backend failed = ' + e.backendTests.failed);
          if (!e.frontendTests || e.frontendTests.total === 0) errors.push('frontend total = 0');
          if (e.frontendTests && e.frontendTests.passed === 0) errors.push('frontend passed = 0');
          if (e.frontendTests && e.frontendTests.failed !== 0) errors.push('frontend failed = ' + e.frontendTests.failed);
          if (!e.e2e || e.e2e.total === 0) errors.push('e2e total = 0');
          if (e.e2e && e.e2e.passed === 0) errors.push('e2e passed = 0');
          if (e.e2e && e.e2e.failed !== 0) errors.push('e2e failed = ' + e.e2e.failed);
          if (e.e2e && e.e2e.status !== 'success') errors.push('e2e status = ' + e.e2e.status);
          if (!e.visualRegression || e.visualRegression.total === 0) errors.push('visual total = 0');
          if (e.visualRegression && e.visualRegression.passed === 0) errors.push('visual passed = 0');
          if (e.visualRegression && e.visualRegression.failed !== 0) errors.push('visual failed = ' + e.visualRegression.failed);
          if (e.visualRegression && e.visualRegression.status !== 'success') errors.push('visual status = ' + e.visualRegression.status);
          if (e.visualRegression && e.visualRegression.baselinesPresent !== e.visualRegression.baselinesRequired) errors.push('baselines mismatch: ' + e.visualRegression.baselinesPresent + '/' + e.visualRegression.baselinesRequired);
          if (!e.coverage || e.coverage.statements === null || !Number.isFinite(e.coverage.statements)) errors.push('coverage.statements invalid');
          if (!e.coverage || e.coverage.branches === null || !Number.isFinite(e.coverage.branches)) errors.push('coverage.branches invalid');
          if (!e.coverage || e.coverage.functions === null || !Number.isFinite(e.coverage.functions)) errors.push('coverage.functions invalid');
          if (!e.coverage || e.coverage.lines === null || !Number.isFinite(e.coverage.lines)) errors.push('coverage.lines invalid');
          if (e.npmAuditProduction && e.npmAuditProduction.critical > 0) errors.push('critical vulnerabilities = ' + e.npmAuditProduction.critical);
          if (e.workflowStatus !== 'success') errors.push('workflowStatus = ' + e.workflowStatus);
          if (e.qualityJobStatus !== 'success') errors.push('qualityJobStatus = ' + e.qualityJobStatus);
          if (e.verificationStatus !== 'success') errors.push('verificationStatus = ' + e.verificationStatus);
          if (errors.length > 0) {
            console.error('EVIDENCE INTEGRITY FAILED:');
            errors.forEach(err => console.error('  - ' + err));
            process.exit(1);
          }
          console.log('Evidence Integrity Gate: PASSED');
          console.log('  commitHash: ' + e.commitHash);
          console.log('  backend: ' + e.backendTests.passed + '/' + e.backendTests.total);
          console.log('  frontend: ' + e.frontendTests.passed + '/' + e.frontendTests.total);
          console.log('  e2e: ' + e.e2e.passed + '/' + e.e2e.total);
          console.log('  visual: ' + e.visualRegression.passed + '/' + e.visualRegression.total);
          console.log('  coverage: ' + e.coverage.statements + '%');
          console.log('  verification: ' + e.verificationStatus);
          "

      - name: Upload verified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-evidence
          path: frontend/public/evidence/latest-validation.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-production
          path: frontend/npm-audit-production.json

      # ─── Diagnostic artifacts ───────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-playwright-report
          path: frontend/playwright-report/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-screenshots
          path: frontend/artifacts/screenshots/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-coverage
          path: frontend/coverage/

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-results
          path: frontend/test-results/

  production-smoke:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for correct Vercel deployment
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          echo "Waiting for Vercel to deploy commit ${EXPECTED_SHA}..."
          for i in $(seq 1 30); do
            HEALTH=$(curl -fsS https://vantiops-360.vercel.app/api/health 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              DEPLOYED_SHA=$(echo "$HEALTH" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).deploymentCommit}catch(e){''}" 2>/dev/null || echo "")
              DB_CONNECTED=$(echo "$HEALTH" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).database.connected}catch(e){false}" 2>/dev/null || echo "false")
              STATUS=$(echo "$HEALTH" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).status}catch(e){''}" 2>/dev/null || echo "")

              if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ] && [ "$DB_CONNECTED" = "true" ] && [ "$STATUS" = "healthy" -o "$STATUS" = "degraded" ]; then
                echo "Production deployed commit ${DEPLOYED_SHA} — status: ${STATUS}, DB: connected"
                exit 0
              fi
              echo "Attempt $i/30 — deployed: ${DEPLOYED_SHA:-unknown}, expected: ${EXPECTED_SHA}, status: ${STATUS:-unknown}"
            else
              echo "Attempt $i/30 — health endpoint not responding"
            fi
            sleep 10
          done
          echo "Production did not deploy expected commit after 30 attempts"
          exit 1

      - name: Playwright production E2E
        id: prod_e2e
        env:
          PLAYWRIGHT_BASE_URL: https://vantiops-360.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --grep-invert "Visual Regression"

      - name: Visual Regression (production)
        id: prod_visual
        env:
          PLAYWRIGHT_BASE_URL: https://vantiops-360.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test tests/e2e/visual-regression.spec.ts

      - name: Generate production evidence
        if: always()
        run: |
          cat > production-evidence.json <<EOF
          {
            "expectedCommit": "${{ github.sha }}",
            "e2eStatus": "${{ steps.prod_e2e.outcome }}",
            "visualRegressionStatus": "${{ steps.prod_visual.outcome }}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence
          path: frontend/production-evidence.json

      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: frontend/playwright-report/

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-screenshots
          path: frontend/artifacts/screenshots/
