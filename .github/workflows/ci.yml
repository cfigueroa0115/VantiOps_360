name: VantiOps 360 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      # ─── Python Backend Checks ───────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Python Lint (ruff)
        run: python -m ruff check src tests
        working-directory: backend

      - name: Python Type Check (pyright)
        run: python -m pyright src
        working-directory: backend

      - name: Python Tests (pytest)
        run: python -m pytest tests -q
        working-directory: backend

      # ─── Frontend Checks ─────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend Lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend Unit Tests
        run: npm run test
        working-directory: frontend

      - name: Frontend Coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Frontend Build
        run: npm run build
        working-directory: frontend

      # ─── SQL Migration Validation ───────────────────────────────────
      - name: Validate SQL Migrations
        run: |
          echo "Validating SQL migration files..."
          ERRORS=0

          for file in database/migrations/*.sql; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")

            if ! grep -qi "UP" "$file"; then
              echo "ERROR: $filename missing UP section"
              ERRORS=$((ERRORS + 1))
            fi

            if ! grep -qi "DOWN" "$file"; then
              echo "ERROR: $filename missing DOWN section"
              ERRORS=$((ERRORS + 1))
            fi

            if ! grep -qiE "(IF NOT EXISTS|IF EXISTS|ON CONFLICT)" "$file"; then
              echo "WARNING: $filename may not be idempotent"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "SQL validation failed with $ERRORS error(s)"
            exit 1
          fi

          echo "All SQL migrations validated successfully"

      # ─── Security Scan ──────────────────────────────────────────────
      - name: Security Scan (exposed secrets)
        run: |
          echo "Scanning for exposed secrets..."
          FOUND=0

          PATTERNS=(
            'password\s*=\s*["\x27][^"\x27]+'
            'api[_-]?key\s*=\s*["\x27][^"\x27]+'
            'secret[_-]?key\s*=\s*["\x27][^"\x27]+'
            'access[_-]?token\s*=\s*["\x27][^"\x27]+'
            'private[_-]?key\s*=\s*["\x27][^"\x27]+'
            'DATABASE_URL\s*=\s*["\x27]postgres'
            'NEON_.*=\s*["\x27][^"\x27]+'
            'AWS_SECRET_ACCESS_KEY\s*=\s*["\x27][^"\x27]+'
          )

          EXCLUDE_DIRS="node_modules|.git|dist|.next|coverage|playwright-report|.hypothesis|__pycache__"
          EXCLUDE_FILES=".env.example|.env.local.example|requirements.md|design.md|tasks.md|CHANGELOG.md"

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.json" --include="*.sql" -E "$pattern" . \
              | grep -vE "($EXCLUDE_DIRS)" \
              | grep -vE "($EXCLUDE_FILES)" \
              | grep -vE "(process\.env|os\.environ|getenv|env\(|\.env)" \
              | grep -vE "(example|placeholder|YOUR_|changeme|xxx|dummy)" \
              | grep -vE '(export DATABASE_URL=.postgresql://\.\.\.)' \
              | grep -vE '(NEON_DATABASE_URL_ENV|NEON_DATABASE_URL.*=.*"NEON)' \
              || true)

            if [ -n "$MATCHES" ]; then
              echo "POTENTIAL SECRET EXPOSURE:"
              echo "$MATCHES"
              FOUND=$((FOUND + 1))
            fi
          done

          if [ $FOUND -gt 0 ]; then
            echo "Security scan found $FOUND potential secret exposure(s)"
            exit 1
          fi

          echo "Security scan passed"

      # ─── Playwright E2E ──────────────────────────────────────────────
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start application for E2E
        run: |
          npm run start > /tmp/vantiops.log 2>&1 &
          npx wait-on http://127.0.0.1:3000 --timeout 30000
        working-directory: frontend

      - name: Playwright E2E tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Visual Regression (compare only)
        run: npx playwright test tests/e2e/visual-regression.spec.ts
        working-directory: frontend

      # ─── Evidence (only on success) ─────────────────────────────────
      - name: Generate verified evidence
        if: success()
        working-directory: frontend
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Collect coverage from coverage-summary.json
          STMT_PCT="null"
          BRANCH_PCT="null"
          FUNC_PCT="null"
          LINE_PCT="null"
          if [ -f "coverage/coverage-summary.json" ]; then
            STMT_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.statements.pct")
            BRANCH_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.branches.pct")
            FUNC_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.functions.pct")
            LINE_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct")
          fi

          # Determine E2E and visual regression status
          E2E_STATUS='"success"'
          VISUAL_STATUS='"success"'
          VERIFICATION_STATUS='"success"'

          cat > public/evidence/latest-validation.json <<EOF
          {
            "commitHash": "${COMMIT_SHA}",
            "generatedAt": "${GENERATED_AT}",
            "source": "github-actions",
            "workflowStatus": "success",
            "qualityJobStatus": "success",
            "e2eStatus": ${E2E_STATUS},
            "visualRegressionStatus": ${VISUAL_STATUS},
            "verificationStatus": ${VERIFICATION_STATUS},
            "productionSmokeStatus": "pending",
            "backendTests": null,
            "frontendTests": null,
            "coverage": {
              "statements": ${STMT_PCT},
              "branches": ${BRANCH_PCT},
              "functions": ${FUNC_PCT},
              "lines": ${LINE_PCT}
            }
          }
          EOF

          echo "Verified evidence generated (verification: ${VERIFICATION_STATUS})"

      - name: Upload verified evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-evidence
          path: frontend/public/evidence/latest-validation.json

      # ─── Diagnostic artifacts (always) ──────────────────────────────
      - name: Upload diagnostic Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-playwright-report
          path: frontend/playwright-report/

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-screenshots
          path: frontend/artifacts/screenshots/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-coverage
          path: frontend/coverage/

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-results
          path: frontend/test-results/

  production-smoke:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment
        run: |
          echo "Waiting for Vercel to deploy commit ${{ github.sha }}..."
          for i in $(seq 1 30); do
            if curl -fsS https://vantiops-360.vercel.app > /dev/null 2>&1 && \
               curl -fsS https://vantiops-360.vercel.app/api/health > /dev/null 2>&1; then
              echo "Production is available (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "Production did not become available after 30 attempts"
          exit 1

      - name: Playwright production smoke
        env:
          PLAYWRIGHT_BASE_URL: https://vantiops-360.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: frontend/playwright-report/

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-screenshots
          path: frontend/artifacts/screenshots/
