name: VantiOps 360 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ─── Python Backend Checks ───────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Python Lint (ruff)
        run: ruff check backend/

      - name: Python Type Check (pyright)
        run: |
          pip install pyright
          pyright backend/

      # ─── Frontend Checks ─────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend Lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend Unit Tests
        run: npm run test
        working-directory: frontend

      # ─── Python Tests ────────────────────────────────────────────────
      - name: Python Tests (pytest)
        run: pytest tests/ -x -q
        working-directory: backend

      # ─── SQL Migration Validation ───────────────────────────────────
      - name: Validate SQL Migrations
        run: |
          echo "Validating SQL migration files..."
          ERRORS=0

          for file in database/migrations/*.sql; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")

            # Check for UP section
            if ! grep -qi "UP" "$file"; then
              echo "ERROR: $filename missing UP section"
              ERRORS=$((ERRORS + 1))
            fi

            # Check for DOWN section
            if ! grep -qi "DOWN" "$file"; then
              echo "ERROR: $filename missing DOWN section"
              ERRORS=$((ERRORS + 1))
            fi

            # Check for idempotent patterns (CREATE IF NOT EXISTS or similar)
            if ! grep -qiE "(IF NOT EXISTS|IF EXISTS|ON CONFLICT)" "$file"; then
              echo "WARNING: $filename may not be idempotent (no IF NOT EXISTS / IF EXISTS / ON CONFLICT)"
            fi

            # Check for dangerous operations
            if grep -qiE "^[[:space:]]*(DROP TABLE|TRUNCATE|DELETE FROM)[^;]*;?$" "$file" | grep -viE "IF EXISTS"; then
              echo "ERROR: $filename contains potentially destructive operation without IF EXISTS guard"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "SQL validation failed with $ERRORS error(s)"
            exit 1
          fi

          echo "All SQL migrations validated successfully"

      # ─── Security Scan ──────────────────────────────────────────────
      - name: Security Scan (exposed secrets)
        run: |
          echo "Scanning for exposed secrets and sensitive patterns..."
          FOUND=0

          # Patterns to detect exposed secrets
          PATTERNS=(
            'password\s*=\s*["\x27][^"\x27]+'
            'api[_-]?key\s*=\s*["\x27][^"\x27]+'
            'secret[_-]?key\s*=\s*["\x27][^"\x27]+'
            'access[_-]?token\s*=\s*["\x27][^"\x27]+'
            'private[_-]?key\s*=\s*["\x27][^"\x27]+'
            'DATABASE_URL\s*=\s*["\x27]postgres'
            'NEON_.*=\s*["\x27][^"\x27]+'
            'AWS_SECRET_ACCESS_KEY\s*=\s*["\x27][^"\x27]+'
          )

          # Files to exclude from scanning
          EXCLUDE_DIRS="node_modules|.git|dist|.next|coverage|playwright-report|.hypothesis|__pycache__"
          EXCLUDE_FILES=".env.example|.env.local.example|requirements.md|design.md|tasks.md|CHANGELOG.md"

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.json" --include="*.sql" -E "$pattern" . \
              | grep -vE "($EXCLUDE_DIRS)" \
              | grep -vE "($EXCLUDE_FILES)" \
              | grep -vE "(process\.env|os\.environ|getenv|env\(|\.env)" \
              | grep -vE "(example|placeholder|YOUR_|changeme|xxx|dummy)" \
              || true)

            if [ -n "$MATCHES" ]; then
              echo "POTENTIAL SECRET EXPOSURE:"
              echo "$MATCHES"
              FOUND=$((FOUND + 1))
            fi
          done

          # Check for .env files that should not be committed
          ENV_FILES=$(find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*" || true)
          if [ -n "$ENV_FILES" ]; then
            echo "WARNING: .env file(s) found in repository:"
            echo "$ENV_FILES"
            echo "Ensure these are in .gitignore"
          fi

          if [ $FOUND -gt 0 ]; then
            echo "Security scan found $FOUND potential secret exposure(s). Review above matches."
            exit 1
          fi

          echo "Security scan passed - no exposed secrets detected"

      # ─── Frontend Build & E2E ────────────────────────────────────────
      - name: Frontend Coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Frontend Build
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start application
        run: |
          npm run build
          npm run start > /tmp/vantiops.log 2>&1 &
          npx wait-on http://127.0.0.1:3000
        working-directory: frontend

      - name: Playwright local smoke
        run: npm run test:e2e
        working-directory: frontend

      - name: Visual Regression — Update baselines
        run: npx playwright test tests/e2e/visual-regression.spec.ts --update-snapshots || true
        working-directory: frontend

      - name: Visual Regression — Compare (0.1% threshold)
        run: npx playwright test tests/e2e/visual-regression.spec.ts
        working-directory: frontend

      # ─── Artifacts ──────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: frontend/artifacts/screenshots/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: frontend/test-results/

      - name: Generate evidence artifacts
        if: always()
        working-directory: frontend
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          DATE_STR=$(date -u +%Y-%m-%d)
          EVIDENCE_DIR="artifacts/evidence/${DATE_STR}_${SHORT_SHA}"
          mkdir -p "${EVIDENCE_DIR}"

          # Collect stack versions from package.json
          NEXT_VERSION=$(node -p "require('./package.json').dependencies.next.replace(/[\\^~]/g,'')")
          REACT_VERSION=$(node -p "require('./package.json').dependencies.react.replace(/[\\^~]/g,'')")
          TS_VERSION=$(node -p "require('./package.json').devDependencies.typescript.replace(/[\\^~]/g,'')")

          # Collect coverage from coverage-summary.json (if exists)
          STMT_PCT=0
          BRANCH_PCT=0
          FUNC_PCT=0
          LINE_PCT=0
          if [ -f "coverage/coverage-summary.json" ]; then
            STMT_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.statements.pct")
            BRANCH_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.branches.pct")
            FUNC_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.functions.pct")
            LINE_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct")
          fi

          # Generate evidence JSON
          cat > "${EVIDENCE_DIR}/evidence.json" <<EOF
          {
            "commitHash": "${COMMIT_SHA}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "stack": {
              "nextjs": "${NEXT_VERSION}",
              "react": "${REACT_VERSION}",
              "typescript": "${TS_VERSION}",
              "python": ">=3.11",
              "polars": "1.14.0"
            },
            "coverage": {
              "statements": ${STMT_PCT},
              "branches": ${BRANCH_PCT},
              "functions": ${FUNC_PCT},
              "lines": ${LINE_PCT}
            },
            "environment": "ci",
            "dataProvenance": "REAL_DATA",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "Evidence artifact generated at ${EVIDENCE_DIR}/evidence.json"

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-artifacts
          path: frontend/artifacts/evidence/

  production-smoke:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright production smoke
        env:
          PLAYWRIGHT_BASE_URL: https://vantiops-360.vercel.app
        run: npm run test:e2e
      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-screenshots
          path: frontend/artifacts/screenshots/
      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: frontend/playwright-report/
