name: Generate Visual Regression Baselines

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type GENERATE to confirm baseline generation"
        required: true

jobs:
  generate:
    if: github.event.inputs.confirm == 'GENERATE'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build application
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start application
        run: |
          npm run start > /tmp/vantiops.log 2>&1 &
          npx wait-on http://127.0.0.1:3000 --timeout 30000
        working-directory: frontend

      - name: Generate baselines
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/visual-regression.spec.ts --update-snapshots
        working-directory: frontend

      - name: Upload baselines artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-baselines-linux
          path: frontend/tests/e2e/visual-regression.spec.ts-snapshots/
